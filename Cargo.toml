[package]
name = "herdr-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Park herdr tabs to free memory without losing them — named restore points that resume where you left off."
license = "MIT"

[[bin]]
name = "herdr-archive"
path = "src/main.rs"

[lib]
name = "herdr_archive"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
crossterm = "=0.29.0"
libc = "=0.2.190"
